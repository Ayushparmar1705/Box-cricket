services:
  auth-service:
    build:
      context: ./app
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=box_cricket_super_secret_key_2026
    depends_on:
      - postgres
    restart: always

  api-docs-hub:
    build:
      context: ./app
      dockerfile: api-docs-hub/Dockerfile
    container_name: api-docs-hub
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AUTH_SERVICE_SPEC_URL=http://localhost:3001/api-docs-json
      - OWNER_REQUEST_SERVICE_SPEC_URL=http://localhost:3006/api-docs-json
    depends_on:
      - auth-service
      - owner-request-service
    restart: always

  owner-request-service:
    build:
      context: ./app
      dockerfile: owner-request-service/Dockerfile
    container_name: owner-request-service
    ports:
      - "3006:3006"
    env_file:
      - path: ./app/owner-request-service/.env
        required: false
    environment:
      - PORT=3006
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  owner-document-service:
    build:
      context: ./app
      dockerfile: owner-document-service/Dockerfile
    container_name: owner-document-service
    ports:
      - "3007:3007"
    env_file:
      - path: ./app/owner-document-service/.env
        required: false
    environment:
      - PORT=3007
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  category-service:
    build:
      context: ./app
      dockerfile: category-service/Dockerfile
    container_name: category-service
    ports:
      - "3002:3002"
    env_file:
      - path: ./app/category-service/.env
        required: false
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  city-service:
    build:
      context: ./app
      dockerfile: city-service/Dockerfile
    container_name: city-service
    ports:
      - "3008:3008"
    env_file:
      - path: ./app/city-service/.env
        required: false
    environment:
      - PORT=3008
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  venue-service:
    build:
      context: ./app
      dockerfile: venue-service/Dockerfile
    container_name: venue-service
    ports:
      - "3009:3009"
    env_file:
      - path: ./app/venue-service/.env
        required: false
    environment:
      - PORT=3009
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  owner-basic-detail-service:
    build:
      context: ./app
      dockerfile: owner-basic-detail-service/Dockerfile
    container_name: owner-basic-detail-service
    ports:
      - "3003:3003"
    env_file:
      - path: ./app/owner-basic-detail-service/.env
        required: false
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=box_cricket_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: box-cricket-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=box_cricket_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: box-cricket-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@boxcricket.app
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
