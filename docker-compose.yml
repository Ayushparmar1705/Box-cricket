services:

  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=box_cricket_db'
      - 'MYSQL_ROOT_PASSWORD=Ayush#2004'
    ports:
      - '3309:3306' # MySQL (host:3309 → container:3306)

  # ─────────────────────────────────────────────
  # ADMINER - MySQL GUI (browser-based)
  # Open: http://localhost:8888
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    ports:
      - '8888:8080'
    depends_on:
      - mysql
    environment:
      - ADMINER_DEFAULT_SERVER=mysql

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # localhost:3030  →  container:8080
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - '3030:8080'
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/box_cricket_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ayush#2004

  # ─────────────────────────────────────────────
  # OWNER REQUEST SERVICE
  # localhost:3031  →  container:8081
  # ─────────────────────────────────────────────
  owner-request-service:
    build:
      context: ./owner-request-service
      dockerfile: Dockerfile
    ports:
      - '3031:8081'
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/box_cricket_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ayush#2004

  # ─────────────────────────────────────────────
  # OWNER DOCUMENT SERVICE
  # localhost:3032  →  container:8082
  # ─────────────────────────────────────────────
  owner-document-service:
    build:
      context: ./owner-document-service/owner-document-service
      dockerfile: Dockerfile
    ports:
      - '3032:8082'
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/box_cricket_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ayush#2004
      - CLOUDINARY_CLOUD_NAME=dblawr8bm
      - CLOUDINARY_API_KEY=914174568446748
      - CLOUDINARY_API_SECRET=p2dCGEBFNQ85g4vUzjr6AvNWtQ8

  # ─────────────────────────────────────────────
  # COUNTRY SERVICE
  # localhost:3033  →  container:8083
  # ─────────────────────────────────────────────
  country-service:
    build:
      context: ./country-service
      dockerfile: Dockerfile
    ports:
      - '3033:8083'
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/box_cricket_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ayush#2004
